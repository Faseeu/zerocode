[project]
name = "zerocode"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Faseeu", email = "faseuu92@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
zerocode = "zerocode:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
